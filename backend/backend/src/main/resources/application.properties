spring.application.name=fair_accounts

# Los datos de conexión se definen cuando el equipo reciba PostgreSQL.
# Las imágenes se guardan fuera de recursos públicos del proyecto.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.files.storage-location=./private-uploads
app.files.max-file-size-bytes=5242880
app.files.max-pixels=20000000
